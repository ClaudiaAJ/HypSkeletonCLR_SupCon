protocolVersion: 2
name: HypSkeletonCLR_multi_cosann_warmup
type: job
prerequisites:
  - name: image
    type: dockerimage
    uri: >-
      master.garching.cluster.campar.in.tum.de:10443/crossclr/crossclr:hyp
taskRoles:
  train:
    instances: 1
    dockerImage: image
    resourcePerInstance:
      cpu: 4
      memoryMB: 60000
      gpu: 1
    nodeSelectionPerInstance:
      - key: nvidia.com/gpu.memory
        operator: Gt
        values:
          - '0'
      - key: nvidia.com/gpu.compute.major
        operator: Gt
        values:
          - '0'
    commands:
      - echo "Start"
      # This is the path where the vscode extension will upload the files specified in the .vscode/settings.json config.
      - cd /mnt/scratch/HypCrosSCLR
      
      # CrosSCLR
      #- python3 main.py pretrain_crossclr_3views --config config/CrosSCLR/crossclr_3views_xview.yaml
      #- python3 main.py linear_evaluation --config config/linear_eval/linear_eval_crossclr_3views_xview.yaml --weights work_dir/crossclr_3views/1_xview_frame50_channel16_epoch300_cross150/epoch300_model.pt
      
      # SkeletonCLR
      #- python3 main.py pretrain_skeletonclr --config config/SkeletonCLR/skeletonclr_xview.yaml
      - python3 main.py linear_evaluation --config config/linear_eval/linear_eval_skeletonclr_xview.yaml --weights work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/epoch300_model.pt
      - echo "Done"
extras:
  com.microsoft.pai.runtimeplugin:
    - plugin: ssh
      parameters:
        jobssh: true
        userssh:
          type: custom
          value: ''
    - plugin: teamwise_storage
      parameters:
        storageConfigNames:
          - ceph-datasets
          - ceph-scratch
          - nfs-projects
  jobStatusChangeNotification:
    running: false
    succeeded: false
    stopped: false
    failed: false
    retried: false
