protocolVersion: 2
name: HypSkeletonCLR_SupCon
type: job
prerequisites:
  - name: image
    type: dockerimage
    uri: >-
      master.garching.cluster.campar.in.tum.de:10443/hypskeletonclr/hypskeletonclr:latest
taskRoles:
  train:
    instances: 1
    dockerImage: image
    resourcePerInstance:
      cpu: 4
      memoryMB: 30000
      gpu: 1
    nodeSelectionPerInstance:
      - key: nvidia.com/gpu.memory
        operator: Gt
        values:
          - '0'
      - key: nvidia.com/gpu.compute.major
        operator: Gt
        values:
          - '0'
    commands:
      - echo "Start"
      # This is the path where the vscode extension will upload the files specified in the .vscode/settings.json config.
      - cd /mnt/scratch/HypSkeletonCLR_SupCon
      # WandB API key
      - export WANDB_API_KEY=8f7dc3eab0cb8691f587c5f508a1be5a585eddc4
      
      - wandb enabled
      #- wandb disabled
      
      # SkeletonCLR
      #- python3 main.py pretrain_skeletonclr --config config/SkeletonCLR/skeletonclr_xview.yaml
      - python3 main.py linear_evaluation --config config/linear_eval/linear_eval_skeletonclr_xview.yaml --weights work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/epoch300_model.pt
      
      - echo "Done"
extras:
  com.microsoft.pai.runtimeplugin:
    - plugin: ssh
      parameters:
        jobssh: true
        userssh:
          type: custom
          value: ''
    - plugin: teamwise_storage
      parameters:
        storageConfigNames:
          - ceph-datasets
          - ceph-scratch
          - nfs-projects
  jobStatusChangeNotification:
    running: false
    succeeded: false
    stopped: false
    failed: false
    retried: false
