work_dir: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/att_test

#weights: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/unsupervised/epoch150_model.pt
#ignore_weights: [encoder_q.fc, encoder_q_motion.fc, encoder_q_bone.fc, encoder_k, encoder_k_motion, encoder_k_bone, queue, queue_motion, queue_bone]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_dual
train_feeder_args:
  data_path: /media/we/Data/Alvaro/datasets/NTU60_frame50/xview/train_position.npy
  label_path: /media/we/Data/Alvaro/datasets/NTU-RGB-D/xview/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.skeletonclr_att.SkeletonCLR_Att
model_args:
  base_encoder: net.stat_gcn_mert.Model
  pretrain: True
  feature_dim: 32 #128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  curvature: 1.0

# optim
nesterov: True
weight_decay: 1e-4
base_lr: 0.01
optimizer: SGD
step: [250]

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 100
start_epoch: 0

view: 'joint'

# supervised training
sup_epoch: 50
temperature: 0.07
curvature: 1.0

# log
save_interval: 5
eval_interval: -1
