work_dir: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/with_loaded_weights

weights: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/2025-02-18_11_21_59/epoch150_model.pt
ignore_weights: [encoder_q.fc, encoder_q_motion.fc, encoder_q_bone.fc, encoder_k, encoder_k_motion, encoder_k_bone, queue, queue_motion, queue_bone]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_dual
train_feeder_args:
  data_path: ../data_preprocessed/data/NTU60_frame50/xview/train_position.npy
  label_path: ../data_preprocessed/data/NTU-RGB-D/xview/train_label.pkl 
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.skeletonclr.SkeletonCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 32 #128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  curvature: 1.0

# optim
nesterov: True
weight_decay: 1e-4
base_lr: 0.01
optimizer: SGD
step: [250]

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 150
start_epoch: 0

view: 'joint'

# supervised training
sup_epoch: 0
temperature: 0.07
curvature: 1.0

# log
save_interval: 5
eval_interval: -1
